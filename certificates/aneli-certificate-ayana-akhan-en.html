<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Certificate — Interior Design Practicum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@200;300;400;500&family=Pinyon+Script&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 297mm; height: 210mm; }
  body {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    background: #FCFAF4;
    color: #17171A;
    font-family: "Montserrat", "Helvetica Neue", sans-serif;
    position: relative;
    overflow: hidden;
  }

  .frame { position: absolute; inset: 0; }

  .sheet {
    position: absolute; inset: 0;
    padding: 29mm 34mm 0;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .studio {
    font-weight: 400; font-size: 8.6pt;
    letter-spacing: .34em; text-indent: .34em;
    text-transform: uppercase; color: #2B2B2E;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 41pt;
    line-height: 1.05;
    letter-spacing: .035em; text-indent: .035em;
    color: #121214;
    margin-top: 11mm;
  }
  h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 400;
    font-size: 13pt;
    letter-spacing: .13em; text-indent: .13em;
    text-transform: uppercase;
    color: #3A3A3E;
    margin-top: 5mm;
  }

  .presented {
    font-weight: 300; font-size: 9pt;
    letter-spacing: .20em; text-indent: .20em;
    color: #3A3A3E;
    margin-top: 19mm;
  }

  .name {
    font-family: "Pinyon Script", "Great Vibes", cursive;
    font-size: 33pt;
    line-height: 1.2;
    color: #101012;
    margin-top: 9mm;
    white-space: nowrap;
  }
  .name-rule {
    width: 170mm; height: 0.5pt; background: #2A2A2D;
    margin-top: 4mm;
  }

  .reason {
    font-weight: 300; font-size: 9.4pt;
    letter-spacing: .13em; text-indent: .13em;
    color: #3A3A3E;
    margin-top: 16mm;
    max-width: 225mm;
    line-height: 1.95;
  }

  .footer {
    position: absolute;
    left: 34mm; right: 34mm; bottom: 32mm;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .cell { width: 70mm; }
  .cell.left  { text-align: left; }
  .cell.right { text-align: center; }

  .place {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500; font-size: 10pt;
    letter-spacing: .04em; color: #1B1B1F;
    padding-bottom: 1mm;
  }

  .sig .ink {
    font-family: "Marck Script", "Allura", cursive;
    font-size: 23pt; line-height: 1;
    color: #16161A;
    height: 13mm;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 1.5mm;
  }
  .sig .line { height: 0.5pt; background: #2A2A2D; }
  .sig .who {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500; font-size: 10pt;
    color: #17171A;
    margin-top: 2.8mm;
    letter-spacing: .02em;
  }
  .sig .role {
    font-weight: 300; font-size: 6.6pt;
    letter-spacing: .2em; text-indent: .2em;
    text-transform: uppercase; color: #5C5A55;
    margin-top: 1.8mm;
  }

  .seal {
    position: absolute;
    left: 50%; bottom: 33mm;
    transform: translateX(-50%);
    width: 36mm; height: 36mm;
  }
</style>
</head>
<body>
  <!-- ornamental bronze frame -->
  <svg class="frame" viewBox="0 0 297 210" width="297mm" height="210mm" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#9A6320"/>
        <stop offset="18%"  stop-color="#C79147"/>
        <stop offset="38%"  stop-color="#8E5A1B"/>
        <stop offset="58%"  stop-color="#CE9C55"/>
        <stop offset="78%"  stop-color="#93601F"/>
        <stop offset="100%" stop-color="#C08A3E"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#bronze)" stroke-linecap="square">
      <rect x="13" y="13" width="271" height="184" stroke-width="1.5"/>
      <rect x="13" y="13" width="271" height="184" rx="15" ry="15" stroke-width="1.5"/>
      <rect x="17.4" y="17.4" width="262.2" height="175.2" stroke-width="0.45"/>
      <rect x="17.4" y="17.4" width="262.2" height="175.2" rx="11.5" ry="11.5" stroke-width="0.45"/>
    </g>
  </svg>

  <div class="sheet">
    <div class="studio">Aneli Interiors</div>

    <h1>CERTIFICATE</h1>
    <h2>of completion</h2>

    <div class="presented">proudly presented to</div>
    <div class="name">Akhan Ayana Sherekhanqyzy</div>
    <div class="name-rule"></div>
    <div class="reason">for successfully completing the six-week interior design practicum</div>
  </div>

  <!-- studio seal -->
  <svg class="seal" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="sealTop" d="M 100,100 m -49,0 a 49,49 0 1,1 98,0" fill="none"/>
      <path id="sealBottom" d="M 100,100 m -43,0 a 43,43 0 1,0 86,0" fill="none"/>
    </defs>
    <g fill="#E6DCCD">
      <circle cx="162.00" cy="100.00" r="11"/><circle cx="159.49" cy="117.47" r="11"/><circle cx="152.16" cy="133.52" r="11"/><circle cx="140.60" cy="146.86" r="11"/><circle cx="125.76" cy="156.40" r="11"/><circle cx="108.82" cy="161.37" r="11"/><circle cx="91.18" cy="161.37" r="11"/><circle cx="74.24" cy="156.40" r="11"/><circle cx="59.40" cy="146.86" r="11"/><circle cx="47.84" cy="133.52" r="11"/><circle cx="40.51" cy="117.47" r="11"/><circle cx="38.00" cy="100.00" r="11"/><circle cx="40.51" cy="82.53" r="11"/><circle cx="47.84" cy="66.48" r="11"/><circle cx="59.40" cy="53.14" r="11"/><circle cx="74.24" cy="43.60" r="11"/><circle cx="91.18" cy="38.63" r="11"/><circle cx="108.82" cy="38.63" r="11"/><circle cx="125.76" cy="43.60" r="11"/><circle cx="140.60" cy="53.14" r="11"/><circle cx="152.16" cy="66.48" r="11"/><circle cx="159.49" cy="82.53" r="11"/>
      <circle cx="100" cy="100" r="66"/>
    </g>
    <circle cx="100" cy="100" r="54" fill="none" stroke="#CFC2AE" stroke-width="0.9"/>
    <text font-family="Montserrat, sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#8D7E68">
      <textPath href="#sealTop" startOffset="50%" text-anchor="middle">ANELI INTERIORS</textPath>
    </text>
    <text font-family="Montserrat, sans-serif" font-size="8.5" font-weight="400" letter-spacing="2.2" fill="#8D7E68">
      <textPath href="#sealBottom" startOffset="50%" text-anchor="middle">ALMATY · KAZAKHSTAN</textPath>
    </text>
    <text x="100" y="94" text-anchor="middle" font-family="Playfair Display, serif" font-size="30" font-weight="500" fill="#9C8B72">A</text>
    <line x1="84" y1="104" x2="116" y2="104" stroke="#BEAF98" stroke-width="0.8"/>
    <text x="100" y="118" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" letter-spacing="1.8" fill="#9C8B72">2026</text>
  </svg>

  <div class="footer">
    <div class="cell left">
      <div class="place">Almaty, 2026</div>
    </div>
    <div class="cell right sig">
      <div class="ink">Anel Tashbayeva</div>
      <div class="line"></div>
      <div class="who">Anel Tashbayeva</div>
      <div class="role">Founder & Practicum Lead</div>
    </div>
  </div>
</body>
</html>
