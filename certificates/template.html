<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE_TAG}}</title>
{{FONTS}}
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; height: 297mm; }
  body {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    background: #FCFAF4;
    color: #17171A;
    font-family: "Montserrat", "Helvetica Neue", sans-serif;
    position: relative;
    overflow: hidden;
  }

  .paper {
    position: absolute; inset: 0;
    background-image: url("data:image/png;base64,{{GRAIN}}");
    background-size: 26mm 26mm; opacity: .55;
  }
  .frame { position: absolute; inset: 0; }

  .sheet {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 42mm 30mm 26mm;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .studio {
    font-weight: 400; font-size: 8.6pt;
    letter-spacing: .34em; text-indent: .34em;
    text-transform: uppercase; color: #2B2B2E;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 40pt;
    line-height: 1.05;
    letter-spacing: .035em; text-indent: .035em;
    color: #121214;
    margin-top: 15mm;
  }
  h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 400;
    font-size: 13pt;
    letter-spacing: .13em; text-indent: .13em;
    color: #3A3A3E;
    margin-top: 5.5mm;
    text-transform: uppercase;
  }

  .presented {
    font-weight: 300; font-size: 9pt;
    letter-spacing: .20em; text-indent: .20em;
    color: #3A3A3E;
    margin-top: 24mm;
  }

  .name {
    font-family: "Pinyon Script", "Great Vibes", cursive;
    font-size: 30pt;
    line-height: 1.2;
    color: #101012;
    margin-top: 9mm;
    white-space: nowrap;
  }
  .name-rule {
    width: 138mm; height: 0.5pt; background: #2A2A2D;
    margin-top: 4mm;
  }

  .reason {
    font-weight: 300; font-size: 9pt;
    letter-spacing: .16em; text-indent: .16em;
    color: #3A3A3E;
    margin-top: 12mm;
    max-width: 150mm;
    line-height: 1.9;
  }
  .duration {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 14pt;
    font-weight: 400;
    line-height: 1.75;
    color: #2E2E32;
    max-width: 132mm;
    margin-top: 24mm;
    font-feature-settings: "lnum" 1;
  }
  .duration em { font-style: italic; }

  .signrow {
    position: absolute;
    left: 28mm; right: 28mm; bottom: 56mm;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .sig { width: 58mm; text-align: center; }
  .sig .ink {
    font-family: "Allura", "Great Vibes", cursive;
    font-size: 25pt; line-height: 1;
    color: #16161A;
    height: 12mm;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 1mm;
  }
  .sig .line { height: 0.5pt; background: #2A2A2D; }
  .sig .role {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500; font-size: 9pt;
    color: #1B1B1F;
    margin-top: 2.6mm;
    letter-spacing: .02em;
  }

  .seal {
    position: absolute;
    left: 50%; bottom: 58mm;
    transform: translateX(-50%);
    width: 36mm; height: 36mm;
  }

  .place {
    position: absolute;
    left: 0; right: 0; bottom: 38mm;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500; font-size: 10pt;
    letter-spacing: .04em;
    color: #1B1B1F;
    text-align: center;
  }
  .certno {
    position: absolute;
    left: 0; right: 0; bottom: 31mm;
    font-weight: 300; font-size: 6pt;
    letter-spacing: .24em; text-indent: .24em;
    text-transform: uppercase; color: #8C8579;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="paper"></div>

  <!-- ornamental bronze frame -->
  <svg class="frame" viewBox="0 0 210 297" width="210mm" height="297mm" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#9A6320"/>
        <stop offset="18%"  stop-color="#C79147"/>
        <stop offset="38%"  stop-color="#8E5A1B"/>
        <stop offset="58%"  stop-color="#CE9C55"/>
        <stop offset="78%"  stop-color="#93601F"/>
        <stop offset="100%" stop-color="#C08A3E"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#bronze)" stroke-linecap="square">
      <rect x="13" y="13" width="184" height="271" stroke-width="1.5"/>
      <rect x="13" y="13" width="184" height="271" rx="15" ry="15" stroke-width="1.5"/>
      <rect x="17.4" y="17.4" width="175.2" height="262.2" stroke-width="0.45"/>
      <rect x="17.4" y="17.4" width="175.2" height="262.2" rx="11.5" ry="11.5" stroke-width="0.45"/>
    </g>
  </svg>

  <div class="sheet">
    <div class="studio">Aneli Interiors</div>

    <h1>{{H1}}</h1>
    <h2>{{H2}}</h2>

    <div class="presented">{{PRESENTED}}</div>
    <div class="name">{{NAME}}</div>
    <div class="name-rule"></div>
    <div class="reason">{{REASON}}</div>

    <div class="duration">{{DURATION}}</div>
  </div>

  <!-- studio seal -->
  <svg class="seal" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="sealTop" d="M 100,100 m -49,0 a 49,49 0 1,1 98,0" fill="none"/>
      <path id="sealBottom" d="M 100,100 m -43,0 a 43,43 0 1,0 86,0" fill="none"/>
    </defs>
    <g fill="#E6DCCD">
      {{SEAL_BUMPS}}
      <circle cx="100" cy="100" r="66"/>
    </g>
    <circle cx="100" cy="100" r="54" fill="none" stroke="#CFC2AE" stroke-width="0.9"/>
    <text font-family="Montserrat, sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#8D7E68">
      <textPath href="#sealTop" startOffset="50%" text-anchor="middle">{{SEAL_TOP}}</textPath>
    </text>
    <text font-family="Montserrat, sans-serif" font-size="8.5" font-weight="400" letter-spacing="2.2" fill="#8D7E68">
      <textPath href="#sealBottom" startOffset="50%" text-anchor="middle">{{SEAL_BOTTOM}}</textPath>
    </text>
    <text x="100" y="94" text-anchor="middle" font-family="Playfair Display, serif" font-size="30" font-weight="500" fill="#9C8B72">A</text>
    <line x1="84" y1="104" x2="116" y2="104" stroke="#BEAF98" stroke-width="0.8"/>
    <text x="100" y="118" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" letter-spacing="1.8" fill="#9C8B72">{{SEAL_YEAR}}</text>
  </svg>

  <div class="signrow">
    <div class="sig">
      <div class="ink">{{SIG_L_INK}}</div>
      <div class="line"></div>
      <div class="role">{{SIG_L_ROLE}}</div>
    </div>
    <div class="sig">
      <div class="ink">{{SIG_R_INK}}</div>
      <div class="line"></div>
      <div class="role">{{SIG_R_ROLE}}</div>
    </div>
  </div>

  <div class="place">{{PLACE}}</div>
  <div class="certno">{{CERT_NO}}</div>
</body>
</html>
